<svg xmlns='http://www.w3.org/2000/svg' width='1420' height='900' viewBox='0 0 1420 900'><title>Modelo fisico de la comercializadora - SQL Server - GR09</title><defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M1 1 L9 5 L1 9' fill='none' stroke='#334155'/></marker></defs><rect width='100%' height='100%' fill='white'/><g font-family='Arial,sans-serif' fill='#172b40' font-size='18'><text x='30' y='38' font-size='26'>Modelo fisico de la comercializadora - SQL Server - GR09</text><rect x='35' y='105' width='480' height='340' rx='8' fill='#eff6ff' stroke='#64748b' stroke-width='1.5'/><text x='50' y='133' font-size='18'>CELULAR</text><text x='50' y='159' font-size='18'>PK ID_CELULAR int IDENTITY</text><text x='50' y='185' font-size='18'>NOMBRE nvarchar(100) NOT NULL</text><text x='50' y='211' font-size='18'>PRECIO numeric(10,2) NOT NULL, &gt; 0</text><text x='50' y='237' font-size='18'>ACTIVO bit NOT NULL DEFAULT 1</text><text x='50' y='263' font-size='18'>IMAGEN varbinary(max) NULL</text><text x='50' y='289' font-size='18'>IMAGEN_TIPO varchar(40) NULL</text><rect x='735' y='105' width='645' height='660' rx='8' fill='#f0fdfa' stroke='#64748b' stroke-width='1.5'/><text x='750' y='133' font-size='18'>FACTURA</text><text x='750' y='159' font-size='18'>PK ID_FACTURA int IDENTITY</text><text x='750' y='185' font-size='18'>UQ ID_OPERACION uniqueidentifier NOT NULL</text><text x='750' y='211' font-size='18'>FECHA datetime2 NOT NULL DEFAULT SYSDATETIME()</text><text x='750' y='237' font-size='18'>CEDULA nvarchar(100) NOT NULL</text><text x='750' y='263' font-size='18'>NOMBRE_CLIENTE nvarchar(100) NOT NULL</text><text x='750' y='289' font-size='18'>FK ID_CELULAR int NOT NULL</text><text x='750' y='315' font-size='18'>NOMBRE_CELULAR nvarchar(100) NOT NULL</text><text x='750' y='341' font-size='18'>FORMA_PAGO varchar(20) NOT NULL</text><text x='750' y='367' font-size='18'>PRECIO numeric(10,2) NOT NULL, &gt; 0</text><text x='750' y='393' font-size='18'>DESCUENTO numeric(10,2) NOT NULL</text><text x='750' y='419' font-size='18'>TOTAL numeric(10,2) NOT NULL, &gt; 0</text><text x='750' y='445' font-size='18'>COD_CLIENTE_BANCO int NULL (referencia remota)</text><text x='750' y='471' font-size='18'>COD_CREDITO int NULL (referencia remota)</text><text x='750' y='497' font-size='18'>NUMERO_CUOTAS int NULL (3..18)</text><text x='750' y='523' font-size='18'>ESTADO varchar(12) NOT NULL</text><path d='M515 260 H735' fill='none' stroke='#334155' stroke-width='1.8'/><text x='535' y='240' font-size='22'>1</text><text x='680' y='240' font-size='22'>0..N</text><text x='535' y='290' font-size='17'>ID_CELULAR</text><text x='35' y='510' font-size='18'>RELACION: un celular puede aparecer en varias facturas.</text><text x='35' y='555' font-size='18'>No existen tablas ni cantidades de inventario.</text><text x='35' y='600' font-size='18'>EFECTIVO: sin cuotas ni credito remoto.</text><text x='35' y='645' font-size='18'>CREDITO_DIRECTO: cuotas obligatorias (3..18).</text><text x='35' y='690' font-size='18'>Las ventas conservan nombre y precio historicos.</text><text x='35' y='825' font-size='17'>Fuente: 03. BDD/01_CrearBases.sql y 03_MigrarImagenes.sql. Las referencias bancarias no son FK locales.</text></g></svg>